<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
    <p>Paragraph 3</p>

    <button id="btn">Get Second Element</button>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <script>
        $(document).ready(function(){
            $("#btn").click(function(){
            var element = $("p").eq(1).text();   // selects second paragraph
            alert(element);
        });
    });
    </script>

</body>
</html>
